name: Build AltServer

on:
  push:
  workflow_dispatch:
    inputs:
      sync_upstream:
        required: false
        default: false
  repository_dispatch:
  schedule:
    - cron: "0 */4 * * *"

env:
  REGISTRY: ghcr.io
  UPSTREAM_BRANCH: arm_1.7.5_jayce

jobs:
  check:
    runs-on: ubuntu-latest
    name: "Check Upstream Updates"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check If Need Checking
        id: needCheck
        if: ${{ github.event_name == 'schedule' || ( github.event_name == 'workflow_dispatch' && github.event.inputs.sync_upstream ) }}
        run: echo "needCheck=1" >> $GITHUB_ENV

      - name: Check Upstream Version
        id: check
        run: |
          if [[ "$needCheck" == 1 ]]; then
            current_upstream=$(git ls-tree HEAD upstream_repo | awk '{ print $3 }')
            echo "Current Upstream Commit: $current_upstream"

            cd upstream_repo
            git fetch origin ${{ env.UPSTREAM_BRANCH }}
            git checkout origin/${{ env.UPSTREAM_BRANCH }}
            new_upstream=$(git rev-parse HEAD)
            cd ..
            echo "New Upstream Commit: $new_upstream"

            if [[ "$current_upstream" != "$new_upstream" ]]; then
              echo "updated=1" >> $GITHUB_OUTPUT
            else
              echo "updated=0" >> $GITHUB_OUTPUT
            fi
          else
            echo "updated=0" >> $GITHUB_OUTPUT
          fi
    outputs:
      updated: ${{ steps.check.outputs.updated }}

  build:
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        builder:
          - ghcr.io/nyamisty/altserver_builder_alpine_armv7
          - ghcr.io/nyamisty/altserver_builder_alpine_aarch64
          - ghcr.io/nyamisty/altserver_builder_alpine_amd64
          - ghcr.io/nyamisty/altserver_builder_alpine_i386
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Do Submodule Update
        run: |
          cd upstream_repo
          git fetch origin ${{ env.UPSTREAM_BRANCH }}
          git checkout origin/${{ env.UPSTREAM_BRANCH }}
          cd ..

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build
        run: mkdir -p /tmp/build_output

      - name: Build
        run: |
          image=${{ matrix.builder }}
          docker pull $image
          docker run -v ${PWD}:/workdir -w /workdir $image bash -c 'mkdir -p build; cd build; make -f ../Makefile -j3'
          cp build/AltServer-* /tmp/build_output || true
          chmod +x /tmp/build_output/* || true
          sudo rm -rf build
          git clean -fdX

      - name: Upload to github artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltServer-${{ strategy.job-index }}
          path: /tmp/build_output/*

  release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [build]
    steps:
      - run: mkdir -p build_output
      - uses: actions/download-artifact@v4
        with:
          path: build_output
      - run: |
          find build_output
          mkdir -p build_release
          mv build_output/*/* build_release 2>/dev/null || mv build_output/* build_release
          ls build_release
          [ "$(ls -A build_release)" ]
      - uses: softprops/action-gh-release@v2
        with:
          files: build_release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_submodule:
    runs-on: ubuntu-latest
    needs: [check, build]
    if: ${{ needs.check.outputs.updated == '1' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          cd upstream_repo
          git fetch origin ${{ env.UPSTREAM_BRANCH }}
          git checkout origin/${{ env.UPSTREAM_BRANCH }}
          cd ..
          git add upstream_repo
          git commit -m "[server] Sync Upstream Repo commit" || echo "No changes"
      - run: git push
